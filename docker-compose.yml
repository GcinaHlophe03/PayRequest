services:
  postgres:
    image: postgres:16
    container_name: payrequest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payrequest
      POSTGRES_PASSWORD: payrequest_dev_password
      POSTGRES_DB: payrequest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: